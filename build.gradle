plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'maven-publish'
}

group = mod_group
version = mod_version + '+' + minecraft_version

base {
    archivesName = mod_name + '-FABRIC'
}

repositories {
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net' }
    maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/releases' }
    mavenCentral()
    maven { name = 'ShatterByte'; url = 'https://maven.shatterbyte.com/releases' }
}

sourceSets {
    main {
        java.srcDirs = ['common/src/main/java', 'fabric/src/main/java']
        resources.srcDirs = ['common/src/main/resources', 'fabric/src/main/resources']
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "it.hurts.shatterbyte.shatterlib:shatterlib-fabric:${shatterlib_version}"
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    localRuntime "com.terraformersmc:modmenu:${modmenu_version}"
    compileOnly 'org.projectlombok:lombok:1.18.40'
    annotationProcessor 'org.projectlombok:lombok:1.18.40'
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
    }
}

def replaceProperties = [
        mod_version: mod_version,
        mod_group: mod_group,
        mod_name: mod_name,
        mod_id: mod_id,
        mod_description: mod_description,
        mod_authors: mod_authors,
        mod_license: mod_license,
        mod_tracker: mod_tracker,
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        java_version: java_version,
        shatterlib_version: shatterlib_version
]

processResources {
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json', '*.mixins.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
